    }
    .checkbox-group label {

      margin-bottom: 8px;
    }
    #SB_container {
      margin-left: 24px;
      display: block;
    }
    #PT_toggle_container {
      margin-left: 24px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 20px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .3s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #2196F3;
    }
    input:checked + .slider:before {
      transform: translateX(20px);
    }
    pre {
      background-color: #f5f5f5;
      padding: 16px;
      border-radius: 8px;
      overflow-x: auto;
    }
  </style>
</head>

      const ptChecked = document.getElementById("PT").checked;
      const ptToggleContainer = document.getElementById("PT_toggle_container");
      ptToggleContainer.style.display = ptChecked ? "flex" : "none";

      for (const id of ["FR", "PT", "TS", "LAC"]) {
